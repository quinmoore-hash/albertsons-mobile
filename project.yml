name: AlbertsonsMobile
options:
  bundleIdPrefix: com.demo
  deploymentTarget:
    iOS: "17.0"
targets:
  AlbertsonsMobile:
    type: application
    platform: iOS
    sources: [AlbertsonsMobile]
    info:
      path: AlbertsonsMobile/Info.plist
      properties:
        CFBundleDisplayName: Albertsons
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
